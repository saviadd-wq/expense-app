            <button onclick="saveUser()">

            </button>

                ⚙️ הגדרות
            </button>

            <hr>

            <h3>הוצאות אחרונות</h3>

            <div id="recentExpenses">
                אין הוצאות עדיין
            </div>

        </div>

        <div id="addExpenseScreen" style="display:none;">

            <h1>הוצאה חדשה</h1>

            <label>חשבונית</label>
            <input type="file" id="receiptImage">

            <label>תאריך</label>
            <input type="text" id="expenseDate" placeholder="15.09.26">

            <label>ספק</label>
            <input type="text" id="vendor">

            <label>סכום</label>
            <input type="number" id="amount">

            <label>קטגוריה</label>

            <select id="category">
                <option>הוצאות רכב</option>
                <option>כיבודים למשרד</option>
                <option>נסיעות</option>
                <option>אש״ל</option>
                <option>אירוח לקוחות וספקים מקומי</option>
                <option>אירוח לקוחות וספקים חו״ל</option>
                <option>ציוד משרדי</option>
                <option>הוצאות אחרות</option>
            </select>

            <label>תיאור</label>
            <input type="text" id="description">

            <label>מספר רכב (אופציונלי)</label>
            <input type="text" id="carNumber">

            <label>אורחים (אופציונלי)</label>
            <input type="text" id="guests">

            <br><br>

            <button onclick="saveExpenseRecord()">
                שמור
            </button>

            <button onclick="backToHome()">
                חזור
            </button>

        </div>

    </div>

    <script>

        function getExpenses() {

            const expenses =
                localStorage.getItem("expenses");

            if (!expenses) {
                return [];
            }

            return JSON.parse(expenses);
        }

        function deleteExpense(index) {

            const confirmed =
                confirm("האם למחוק את ההוצאה?");

            if (!confirmed) {
                return;
            }

            const expenses =
                getExpenses();

            expenses.splice(index, 1);

            localStorage.setItem(
                "expenses",
                JSON.stringify(expenses)
            );

            updateHomeScreen();
        }

        function updateHomeScreen() {

            const expenses =
                getExpenses();

            document.getElementById(
                "expenseCount"
            ).innerText =
                expenses.length;

            let total = 0;

            expenses.forEach(expense => {

                total += Number(
                    expense.amount || 0
                );
            });

            document.getElementById(
                "totalAmount"
            ).innerText =
                "₪" + total;

            const recentExpenses =
                document.getElementById(
                    "recentExpenses"
                );

            if (expenses.length === 0) {

                recentExpenses.innerHTML =
                    "אין הוצאות עדיין";

                return;
            }

            let html = "";

            expenses
                .slice()
                .reverse()
                .forEach((expense, reverseIndex) => {

                    const realIndex =
                        expenses.length - 1 - reverseIndex;

                    html += `
                        <div style="margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #ddd;">
                            <div>
                                ${expense.date} |
                                ${expense.vendor} |
                                ₪${expense.amount}
                            </div>

                            <button
                                style="margin-top:5px;"
                                onclick="deleteExpense(${realIndex})">
                                🗑️ מחיקה
                            </button>
                        </div>
                    `;
                });

            recentExpenses.innerHTML =
                html;
        }
