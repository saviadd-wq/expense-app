<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="setupScreen">

            <h1>Expense App</h1>

            <h2>הגדרה ראשונית</h2>

            <p>הנתונים נשמרים במכשיר וימולאו אוטומטית בטופסי ההוצאות.</p>

            <label>שם מלא</label>
            <input type="text" id="fullName">

            <label>מחלקה</label>

            <select id="department">
                <option value="">בחר מחלקה</option>
                <option>שיווק</option>
                <option>מכירות</option>
                <option>כספים</option>
                <option>תפעול</option>
                <option>משאבי אנוש</option>
                <option>מו״פ</option>
                <option>פיתוח עסקי</option>
                <option>שירות</option>
                <option>אחר</option>
            </select>

            <button onclick="saveUser()">
                שמירה
            </button>

            <div id="savedMessage" class="success"></div>

        </div>

        <div id="homeScreen" style="display:none;">

            <h1>Expense App</h1>

            <h2 id="welcomeTitle"></h2>

            <p>
                החודש:
                <strong id="expenseCount">0</strong>
                הוצאות
            </p>

            <p>
                סה"כ:
                <strong id="totalAmount">₪0</strong>
            </p>

            <button>
                ➕ הוצאה חדשה
            </button>

            <button>
                📄 הפק טופס
            </button>

            <button onclick="showSettings()">
                ⚙️ הגדרות
            </button>

            <hr>

            <h3>הוצאות אחרונות</h3>

            <div id="recentExpenses">
                אין הוצאות עדיין
            </div>

        </div>

    </div>

    <script>

        function saveUser() {

            const fullName =
                document.getElementById("fullName").value;

            const department =
                document.getElementById("department").value;

            if (!fullName || !department) {

                alert("נא למלא שם ומחלקה");

                return;
            }

            localStorage.setItem(
                "fullName",
                fullName
            );

            localStorage.setItem(
                "department",
                department
            );

            loadHomeScreen();
        }

        function loadHomeScreen() {

            const fullName =
                localStorage.getItem("fullName");

            if (!fullName) {
                return;
            }

            document.getElementById(
                "setupScreen"
            ).style.display = "none";

            document.getElementById(
                "homeScreen"
            ).style.display = "block";

            document.getElementById(
                "welcomeTitle"
            ).innerHTML =
                "שלום " + fullName;
        }

        function showSettings() {

            document.getElementById(
                "homeScreen"
            ).style.display = "none";

            document.getElementById(
                "setupScreen"
            ).style.display = "block";
        }

        window.onload = function () {

            const fullName =
                localStorage.getItem("fullName");

            const department =
                localStorage.getItem("department");

            if (fullName) {

                document.getElementById(
                    "fullName"
                ).value = fullName;
            }

            if (department) {

                document.getElementById(
                    "department"
                ).value = department;
            }

            if (fullName && department) {

                loadHomeScreen();
            }
        };

    </script>

</body>

</html>
