    <script>
        function normalizeOcrDate(day, month, year) {
            const normalizedYear = String(year).length === 4
                ? String(year).slice(-2)
                : String(year).padStart(2, "0");

            return String(day).padStart(2, "0") + "." +
                String(month).padStart(2, "0") + "." + normalizedYear;
        }

        function extractDateFromText(text) {
            const match = text.match(/\b(0?[1-9]|[12]\d|3[01])[.\/-](0?[1-9]|1[0-2])[.\/-](\d{2}|\d{4})\b/);
            return match ? normalizeOcrDate(match[1], match[2], match[3]) : "";
        }

        function extractAmountFromText(text) {
            const lines = text.split(/\r?\n/).map(function (line) {
                return line.trim();
            }).filter(Boolean);

            const totalWords = /(סה.?כ|לתשלום|סכום לתשלום|total|amount|grand total)/i;
            const numberPattern = /(?:₪\s*)?(\d{1,6}(?:[,.]\d{2})?)(?:\s*₪)?/g;
            const keywordCandidates = [];

            lines.forEach(function (line) {
                if (!totalWords.test(line)) return;

                const matches = Array.from(line.matchAll(numberPattern));
                matches.forEach(function (match) {
                    const value = Number(match[1].replace(",", "."));
                    if (Number.isFinite(value) && value > 0) keywordCandidates.push(value);
                });
            });

            if (keywordCandidates.length > 0) {
                return Math.max.apply(null, keywordCandidates);
            }

            const decimalCandidates = [];
            const decimalPattern = /(?:₪\s*)?(\d{1,5}[,.]\d{2})(?:\s*₪)?/g;
            const matches = Array.from(text.matchAll(decimalPattern));

            matches.forEach(function (match) {
                const value = Number(match[1].replace(",", "."));
                if (Number.isFinite(value) && value > 0) decimalCandidates.push(value);
            });

            return decimalCandidates.length > 0
                ? Math.max.apply(null, decimalCandidates)
                : "";
        }

        function extractCurrencyFromText(text) {
            const upper = String(text || "").toUpperCase();

            if (/\b(ILS|NIS)\b/.test(upper) || /₪/.test(text)) return "ILS";
            if (/\bUSD\b/.test(upper) || /US\s*\$/.test(upper)) return "USD";
            if (/\bGBP\b/.test(upper) || /£/.test(text)) return "GBP";
            if (/\bEUR\b/.test(upper) || /€/.test(text)) return "EUR";
            if (/\bCAD\b/.test(upper) || /C\$/.test(upper)) return "CAD";
            if (/\bAUD\b/.test(upper) || /A\$/.test(upper)) return "AUD";
            if (/\bJPY\b/.test(upper) || /¥/.test(text)) return "JPY";
            if (/\bCHF\b/.test(upper)) return "CHF";
            if (/\bCNY\b/.test(upper) || /RMB/.test(upper)) return "CNY";
            if (/\bHKD\b/.test(upper) || /HK\$/.test(upper)) return "HKD";
            if (/\bSGD\b/.test(upper) || /S\$/.test(upper)) return "SGD";
            if (/\bINR\b/.test(upper) || /₹/.test(text)) return "INR";
            if (/\bAED\b/.test(upper)) return "AED";
            if (/\bTHB\b/.test(upper) || /฿/.test(text)) return "THB";
            if (/\bTRY\b/.test(upper) || /₺/.test(text)) return "TRY";
            if (/\bZAR\b/.test(upper)) return "ZAR";
            if (/\bMXN\b/.test(upper)) return "MXN";
            if (/\bBRL\b/.test(upper) || /R\$/.test(upper)) return "BRL";

            if (/\$/.test(text)) return "USD";
            return "ILS";
        }

        function extractInvoiceNumberFromText(text) {
            const patterns = [
                /(?:מס(?:פר|׳|')?\s*(?:חשבונית|קבלה)|חשבונית\s*מס(?:פר|׳|')?|invoice\s*(?:no\.?|number|#)|receipt\s*(?:no\.?|number|#))\s*[:#.-]?\s*([A-Z0-9\/-]{2,30})/i,
                /(?:document\s*(?:no\.?|number|#))\s*[:#.-]?\s*([A-Z0-9\/-]{2,30})/i
            ];

            for (const pattern of patterns) {
                const match = String(text || "").match(pattern);
                if (match && match[1]) return match[1].trim();
            }

            return "";
        }

        function extractVendorFromText(text) {
            const ignored = /(חשבונית|קבלה|מקור|העתק|עוסק|ח\.פ|מספר|תאריך|סה.?כ|total|טלפון|כתובת)/i;
            const lines = text.split(/\r?\n/).map(function (line) {
                return line.replace(/[^\u0590-\u05FFa-zA-Z0-9 &'".-]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            });

            return lines.find(function (line) {
                return line.length >= 2 &&
                    line.length <= 60 &&
                    /[\u0590-\u05FFa-zA-Z]/.test(line) &&
                    !ignored.test(line);
            }) || "";
        }

        async function runReceiptOcr(file) {
            const status = document.getElementById("ocrStatus");
            status.style.display = "block";
            status.textContent = "מכין את מנוע ה-OCR...";

            if (!window.Tesseract) {
                status.textContent = "לא ניתן לטעון את מנוע ה-OCR. בדוק את החיבור לאינטרנט ונסה שוב.";
                return;
            }

            try {
                const result = await Tesseract.recognize(file, "heb+eng", {
                    logger: function (message) {
                        if (message.status === "recognizing text") {
                            const percent = Math.round((message.progress || 0) * 100);
                            status.textContent = "מנתח את החשבונית... " + percent + "%";
                        } else {
                            status.textContent = "מכין את מנוע ה-OCR...";
                        }
                    }
                });

                const text = result.data.text || "";
                const date = extractDateFromText(text);
                const vendor = extractVendorFromText(text);
                const amount = extractAmountFromText(text);
                const currency = extractCurrencyFromText(text);
                const invoiceNumber = extractInvoiceNumberFromText(text);

                if (date) document.getElementById("expenseDate").value = date;
                if (vendor) document.getElementById("vendor").value = vendor;
                if (invoiceNumber) document.getElementById("invoiceNumber").value = invoiceNumber;
                if (amount !== "") document.getElementById("amount").value = Number(amount).toFixed(2);
                document.getElementById("currency").value = currency;

                if (date || vendor || amount !== "") {
                    status.textContent = "✅ הסריקה הסתיימה. נא לבדוק את הפרטים ולתקן במידת הצורך.";
                } else {
                    status.textContent = "הסריקה הסתיימה, אך לא זוהו פרטים. אפשר למלא את השדות ידנית.";
                }
            } catch (error) {
                console.error("OCR error:", error);
                status.textContent = "הסריקה נכשלה. אפשר לנסות תמונה ברורה יותר או למלא ידנית.";
            }
        }

        function handleReceiptSelection(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("נא לבחור קובץ תמונה");
                event.target.value = "";
                return;
            }

            const preview = document.getElementById("receiptPreview");
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";

            runReceiptOcr(file);
        }

        const signatureCanvas = document.getElementById("signatureCanvas");
        const signatureContext = signatureCanvas.getContext("2d");
        let signatureDrawing = false;
        let signatureHasInk = false;

        function signaturePoint(event) {
            const rect = signatureCanvas.getBoundingClientRect();
            const source = event.touches ? event.touches[0] : event;
            return {
                x: (source.clientX - rect.left) * (signatureCanvas.width / rect.width),
                y: (source.clientY - rect.top) * (signatureCanvas.height / rect.height)
            };
        }

        function startSignature(event) {
            event.preventDefault();
            signatureDrawing = true;
            const point = signaturePoint(event);
            signatureContext.beginPath();
            signatureContext.moveTo(point.x, point.y);
        }

        function drawSignature(event) {
            if (!signatureDrawing) return;
            event.preventDefault();
            const point = signaturePoint(event);
            signatureContext.lineWidth = 3;
            signatureContext.lineCap = "round";
            signatureContext.strokeStyle = "#111";
            signatureContext.lineTo(point.x, point.y);
            signatureContext.stroke();
            signatureHasInk = true;
        }

        function stopSignature(event) {
            if (event) event.preventDefault();
            signatureDrawing = false;
        }

        function clearSignature() {
            signatureContext.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
            signatureHasInk = false;
            localStorage.removeItem("employeeSignature");
            document.getElementById("signatureStatus").textContent = "החתימה נמחקה";
        }

        function loadSavedSignature() {
            const saved = localStorage.getItem("employeeSignature");
            if (!saved) return;
            const image = new Image();
            image.onload = function () {
                signatureContext.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
                signatureContext.drawImage(image, 0, 0, signatureCanvas.width, signatureCanvas.height);
                signatureHasInk = true;
                document.getElementById("signatureStatus").textContent = "✅ חתימה שמורה";
            };
            image.src = saved;
        }

        function formatReportDate(date) {
            return String(date.getDate()).padStart(2, "0") + "." +
                String(date.getMonth() + 1).padStart(2, "0") + "." +
                String(date.getFullYear()).slice(-2);
        }

        function drawRtlText(context, text, x, y, size, bold) {
            context.save();
            context.direction = "rtl";
            context.textAlign = "right";
            context.textBaseline = "middle";
            context.fillStyle = "#111";
            context.font = (bold ? "bold " : "") + size + "px Arial";
            context.fillText(String(text || ""), x, y);
            context.restore();
        }

        function drawCenteredText(context, text, x, y, size, bold) {
            context.save();
            context.direction = "rtl";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillStyle = "#111";
            context.font = (bold ? "bold " : "") + size + "px Arial";
            context.fillText(String(text || ""), x, y);
            context.restore();
        }

        async function renderTemplateCanvas() {
            if (!window.pdfjsLib) throw new Error("PDF.js is unavailable");
            pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            const response = await fetch("expense-claim-template.pdf");
            if (!response.ok) throw new Error("Template file was not found");
            const data = await response.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: data }).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2 });
            const canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;
            return canvas;
        }

        function categoryColumnX(category, scale) {
            const map = {
                "כיבודים למשרד": 604,
                "נסיעות": 562,
                "אש״ל": 520,
                "הוצאות רכב": 478,
                "אירוח לקוחות וספקים מקומי": 436,
                "אירוח לקוחות וספקים חו״ל": 394,
                "ציוד משרדי": 352,
                "הוצאות אחרות": 294
            };
            return (map[category] || 294) * scale;
        }

        async function generateReport() {
            const expenses = getExpenses();
            if (expenses.length === 0) {
                alert("אין הוצאות להפקת טופס");
                return;
            }

            const approver = window.prompt("מי מאשר את הטופס?");
            if (!approver || !approver.trim()) return;

            const savedSignature = localStorage.getItem("employeeSignature");
            if (!savedSignature) {
                alert("יש להוסיף חתימה בהגדרות לפני הפקת הטופס");
                showSettings();
                return;
            }

            const status = document.getElementById("reportStatus");
            status.style.display = "block";
            status.textContent = "מפיק את הטופס...";

            try {
                const templateCanvas = await renderTemplateCanvas();
                const canvas = document.createElement("canvas");
                canvas.width = templateCanvas.width;
                canvas.height = templateCanvas.height;
                const context = canvas.getContext("2d");
                context.drawImage(templateCanvas, 0, 0);

                const scale = canvas.width / 792;
                const fullName = localStorage.getItem("fullName") || "";
                const department = localStorage.getItem("department") || "";
                const reportDate = formatReportDate(new Date());

                drawCenteredText(context, fullName, 650 * scale, 88 * scale, 8 * scale, true);
                drawCenteredText(context, department, 650 * scale, 104 * scale, 7.5 * scale, false);
                drawCenteredText(context, reportDate, 540 * scale, 88 * scale, 8 * scale, false);

                const rowStartY = 157.3;
                const rowHeight = 13.2;
                expenses.slice(0, 20).forEach(function (expense, index) {
                    const y = (rowStartY + index * rowHeight) * scale;
                    // Row numbers already exist in the original template.
                    drawCenteredText(context, expense.date || "", 694 * scale, y, 6.2 * scale, false);
                    let description = expense.description || expense.vendor || "";
                    if (expense.invoiceNumber) {
                        description += " | חשבונית: " + expense.invoiceNumber;
                    }
                    drawRtlText(context, description.slice(0, 38), 654 * scale, y, 5.7 * scale, false);
                    drawCenteredText(context, formatMoney(expense.amount, expense.currency || "ILS"), categoryColumnX(expense.category, scale), y - (expense.carNumber ? 2.4 * scale : 0), 6.4 * scale, false);
                    drawCenteredText(context, formatMoney(expense.amount, expense.currency || "ILS"), 122 * scale, y, 6.2 * scale, false);
                    if (expense.guests) drawCenteredText(context, expense.guests.slice(0, 18), 42 * scale, y, 5.8 * scale, false);
                    if (expense.carNumber) {
                        drawCenteredText(context, "רכב: " + expense.carNumber.slice(0, 14), 478 * scale, y + 3.7 * scale, 4.8 * scale, false);
                    }
                });

                const totals = {};
                expenses.forEach(function (expense) {
                    const currency = expense.currency || "ILS";
                    totals[currency] = (totals[currency] || 0) + Number(expense.amount || 0);
                });
                const totalsText = Object.keys(totals).map(function (currency) {
                    return formatMoney(totals[currency], currency);
                }).join(" / ");
                drawCenteredText(context, totalsText, 195 * scale, 449 * scale, 6.8 * scale, true);
                drawCenteredText(context, fullName, 700 * scale, 507 * scale, 6.4 * scale, false);
                drawCenteredText(context, reportDate, 700 * scale, 544 * scale, 6.4 * scale, false);
                drawCenteredText(context, approver.trim(), 520 * scale, 507 * scale, 6.4 * scale, false);
                drawCenteredText(context, reportDate, 520 * scale, 544 * scale, 6.4 * scale, false);

                const signatureImage = new Image();
                await new Promise(function (resolve, reject) {
                    signatureImage.onload = resolve;
                    signatureImage.onerror = reject;
                    signatureImage.src = savedSignature;
                });
                context.drawImage(signatureImage, 650 * scale, 472 * scale, 92 * scale, 24 * scale);

                const jsPDF = window.jspdf && window.jspdf.jsPDF;
                if (!jsPDF) throw new Error("jsPDF is unavailable");
                const report = new jsPDF({ orientation: "landscape", unit: "pt", format: [792, 612] });
                report.addImage(canvas.toDataURL("image/jpeg", 0.94), "JPEG", 0, 0, 792, 612);

                status.textContent = "מוסיף את החשבוניות...";
                for (const expense of expenses) {
                    if (!expense.receiptImage) continue;
                    const image = new Image();
                    await new Promise(function (resolve, reject) {
                        image.onload = resolve;
                        image.onerror = reject;
                        image.src = expense.receiptImage;
                    });
                    report.addPage("a4", image.width >= image.height ? "landscape" : "portrait");
                    const pageWidth = report.internal.pageSize.getWidth();
                    const pageHeight = report.internal.pageSize.getHeight();
                    const ratio = Math.min((pageWidth - 40) / image.width, (pageHeight - 40) / image.height);
                    const width = image.width * ratio;
                    const height = image.height * ratio;
                    report.addImage(expense.receiptImage, "JPEG", (pageWidth - width) / 2, (pageHeight - height) / 2, width, height);
                }

                report.save("Expense-Claim-" + reportDate.replaceAll(".", "-") + ".pdf");
                status.textContent = "✅ הטופס הופק והורד למכשיר";

                window.setTimeout(function () {
                    askToDeleteGeneratedExpenses();
                }, 400);
            } catch (error) {
                console.error("Report generation error:", error);
                status.textContent = "הפקת הטופס נכשלה. ודא שקובץ התבנית נמצא ב-GitHub ונסה שוב.";
            }
        }

        function compressReceipt(file) {
            return new Promise(function (resolve, reject) {
                const image = new Image();
                image.onload = function () {
                    const maxDimension = 1400;
                    const ratio = Math.min(1, maxDimension / Math.max(image.width, image.height));
                    const canvas = document.createElement("canvas");
                    canvas.width = Math.round(image.width * ratio);
                    canvas.height = Math.round(image.height * ratio);
                    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL("image/jpeg", 0.78));
                };
                image.onerror = reject;
                image.src = URL.createObjectURL(file);
            });
        }

        function getExpenses() {
            const stored = localStorage.getItem("expenses");
            if (!stored) return [];

            try {
                const parsed = JSON.parse(stored);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error("שגיאה בקריאת ההוצאות", error);
                return [];
            }
        }

        function storeExpenses(expenses) {
            localStorage.setItem("expenses", JSON.stringify(expenses));
        }

        function escapeHtml(value) {
            const element = document.createElement("div");
            element.textContent = String(value ?? "");
            return element.innerHTML;
        }

        function parseAmount(value) {
            const normalized = String(value)
                .trim()
                .replace(/\s/g, "")
                .replace(/₪/g, "")
                .replace(/,/g, ".");

            return Number(normalized);
        }

        function formatAmount(value) {
            return Number(value || 0).toLocaleString("he-IL", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function currencySymbol(currency) {
            const symbols = { ILS: "₪", USD: "$", GBP: "£", EUR: "€", JPY: "¥", INR: "₹", THB: "฿", TRY: "₺" };
            return symbols[currency] || (currency + " ");
        }

        function formatMoney(value, currency) {
            return currencySymbol(currency || "ILS") + formatAmount(value);
        }

        function updateHomeScreen() {
            const expenses = getExpenses();
            const countElement = document.getElementById("expenseCount");
            const totalsElement = document.getElementById("totalsByCurrency");
            const listElement = document.getElementById("recentExpenses");

            countElement.textContent = expenses.length;

            const totals = {};
            expenses.forEach(function (expense) {
                const currency = expense.currency || "ILS";
                totals[currency] = (totals[currency] || 0) + Number(expense.amount || 0);
            });

            const currencyOrder = ["ILS", "USD", "GBP", "EUR"];
            const currencies = Object.keys(totals).sort(function (a, b) {
                const ai = currencyOrder.indexOf(a);
                const bi = currencyOrder.indexOf(b);
                if (ai === -1 && bi === -1) return a.localeCompare(b);
                if (ai === -1) return 1;
                if (bi === -1) return -1;
                return ai - bi;
            });

            totalsElement.innerHTML = currencies.length
                ? currencies.map(function (currency) {
                    return "<div>" + formatMoney(totals[currency], currency) + "</div>";
                }).join("")
                : "₪0.00";

            if (expenses.length === 0) {
                listElement.textContent = "אין הוצאות עדיין";
                return;
            }

            let html = "";

            for (let index = expenses.length - 1; index >= 0; index -= 1) {
                const expense = expenses[index];

                html +=
                    '<div style="margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid #ddd;">' +
                        '<p style="margin:0 0 8px 0;">' +
                            escapeHtml(expense.date) + " | " +
                            escapeHtml(expense.vendor) + " | " +
                            formatMoney(expense.amount, expense.currency || "ILS") +
                        '</p>' +
                        '<button type="button" class="delete-expense-button" data-index="' + index + '">🗑️ מחיקה</button>' +
                    '</div>';
            }

            listElement.innerHTML = html;

            document.querySelectorAll(".delete-expense-button").forEach(function (button) {
                button.addEventListener("click", function () {
                    deleteExpense(Number(button.dataset.index));
                });
            });
        }

        function deleteExpense(index) {
            const expenses = getExpenses();

            if (!Number.isInteger(index) || index < 0 || index >= expenses.length) {
                alert("לא ניתן למצוא את ההוצאה למחיקה");
                return;
            }

            const vendor = expenses[index].vendor || "";
            const message = vendor
                ? "האם למחוק את ההוצאה של " + vendor + "?"
                : "האם למחוק את ההוצאה?";

            if (!window.confirm(message)) return;

            expenses.splice(index, 1);
            storeExpenses(expenses);
            updateHomeScreen();
        }

        function deleteAllExpenses() {
            const expenses = getExpenses();

            if (expenses.length === 0) {
                alert("אין הוצאות למחיקה");
                return;
            }

            const confirmed = window.confirm(
                "האם למחוק את כל ההוצאות והחשבוניות? פעולה זו אינה ניתנת לביטול."
            );

            if (!confirmed) return;

            localStorage.removeItem("expenses");
            updateHomeScreen();
            alert("כל ההוצאות והחשבוניות נמחקו");
        }

        function askToDeleteGeneratedExpenses() {
            const confirmed = window.confirm(
                "הטופס הופק בהצלחה. האם למחוק את החשבוניות שהופקו כבר?"
            );

            if (!confirmed) return;

            localStorage.removeItem("expenses");
            updateHomeScreen();
            alert("החשבוניות וההוצאות שנכללו בטופס נמחקו");
        }

        function clearExpenseForm() {
            document.getElementById("receiptImage").value = "";
            document.getElementById("receiptPreview").removeAttribute("src");
            document.getElementById("receiptPreview").style.display = "none";
            document.getElementById("ocrStatus").style.display = "none";
            document.getElementById("ocrStatus").textContent = "ממתין לתמונה";
            document.getElementById("expenseDate").value = "";
            document.getElementById("vendor").value = "";
            document.getElementById("invoiceNumber").value = "";
            document.getElementById("amount").value = "";
            document.getElementById("currency").value = "ILS";
            document.getElementById("category").value = "הוצאות רכב";
            document.getElementById("description").value = "";
            document.getElementById("carNumber").value = "";
            document.getElementById("guests").value = "";
        }

        async function saveExpenseRecord() {
            const date = document.getElementById("expenseDate").value.trim();
            const vendor = document.getElementById("vendor").value.trim();
            const amountText = document.getElementById("amount").value;
            const amount = parseAmount(amountText);

            if (!date) {
                alert("נא למלא תאריך");
                return;
            }

            if (!vendor) {
                alert("נא למלא ספק");
                return;
            }

            if (!amountText.trim() || !Number.isFinite(amount) || amount <= 0) {
                alert("נא למלא סכום תקין");
                return;
            }

            let receiptImage = "";
            const receiptFile = document.getElementById("receiptImage").files[0];
            if (receiptFile) {
                try {
                    receiptImage = await compressReceipt(receiptFile);
                } catch (error) {
                    console.error("Receipt compression error:", error);
                }
            }

            const expense = {
                date: date,
                vendor: vendor,
                invoiceNumber: document.getElementById("invoiceNumber").value.trim(),
                amount: amount,
                currency: document.getElementById("currency").value || "ILS",
                category: document.getElementById("category").value,
                description: document.getElementById("description").value.trim(),
                carNumber: document.getElementById("carNumber").value.trim(),
                guests: document.getElementById("guests").value.trim(),
                receiptImage: receiptImage
            };

            const expenses = getExpenses();
            expenses.push(expense);
            storeExpenses(expenses);

            clearExpenseForm();
            alert("✅ ההוצאה נשמרה");
            showHomeScreen();
        }

        function showHomeScreen() {
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("addExpenseScreen").style.display = "none";
            document.getElementById("homeScreen").style.display = "block";

            const fullName = localStorage.getItem("fullName") || "";
            document.getElementById("welcomeTitle").textContent = "שלום " + fullName;
            updateHomeScreen();
        }

        function showAddExpense() {
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("homeScreen").style.display = "none";
            document.getElementById("addExpenseScreen").style.display = "block";
        }

        function showSettings() {
            document.getElementById("homeScreen").style.display = "none";
            document.getElementById("addExpenseScreen").style.display = "none";
            document.getElementById("setupScreen").style.display = "block";
        }

        function saveUser() {
            const fullName = document.getElementById("fullName").value.trim();
            const department = document.getElementById("department").value;

            if (!fullName || !department) {
                alert("נא למלא שם ומחלקה");
                return;
            }

            localStorage.setItem("fullName", fullName);
            localStorage.setItem("department", department);
            if (signatureHasInk) {
                localStorage.setItem("employeeSignature", signatureCanvas.toDataURL("image/png"));
                document.getElementById("signatureStatus").textContent = "✅ חתימה שמורה";
            }
            document.getElementById("savedMessage").textContent = "✅ הנתונים נשמרו בהצלחה";
            showHomeScreen();
        }

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("saveUserButton").addEventListener("click", saveUser);
            document.getElementById("showAddExpenseButton").addEventListener("click", showAddExpense);
            document.getElementById("showSettingsButton").addEventListener("click", showSettings);
            document.getElementById("generateReportButton").addEventListener("click", generateReport);
            document.getElementById("clearSignatureButton").addEventListener("click", clearSignature);
            document.getElementById("deleteAllExpensesButton").addEventListener("click", deleteAllExpenses);
            document.getElementById("saveExpenseButton").addEventListener("click", saveExpenseRecord);
            document.getElementById("backToHomeButton").addEventListener("click", showHomeScreen);
            document.getElementById("receiptImage").addEventListener("change", handleReceiptSelection);

            signatureCanvas.addEventListener("mousedown", startSignature);
            signatureCanvas.addEventListener("mousemove", drawSignature);
            signatureCanvas.addEventListener("mouseup", stopSignature);
            signatureCanvas.addEventListener("mouseleave", stopSignature);
            signatureCanvas.addEventListener("touchstart", startSignature, { passive: false });
            signatureCanvas.addEventListener("touchmove", drawSignature, { passive: false });
            signatureCanvas.addEventListener("touchend", stopSignature, { passive: false });
            loadSavedSignature();

            const fullName = localStorage.getItem("fullName");
            const department = localStorage.getItem("department");

            if (fullName) document.getElementById("fullName").value = fullName;
            if (department) document.getElementById("department").value = department;

            if (fullName && department) {
                showHomeScreen();
            } else {
                document.getElementById("setupScreen").style.display = "block";
            }
        });
    </script>
</body>
</html>
