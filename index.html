<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense App</title>
    <style.css>
</head>

<body>

    <div class="container">

        <h1>Expense App</h1>

        <h2>הגדרה ראשונית</h2>

        <p>הנתונים נשמרים במכשיר וימולאו אוטומטית בטופסי ההוצאות.</p>

        <form id="setupForm">

            <label>שם מלא</label>
            <input type="text" id="fullName">

            <label>מחלקה</label>
            <select id="department">
                <option value="">בחר מחלקה</option>
                <option>שיווק</option>
                <option>מכירות</option>
                <option>כספים</option>
                <option>תפעול</option>
                <option>משאבי אנוש</option>
                <option>מו״פ</option>
                <option>פיתוח עסקי</option>
                <option>שירות</option>
                <option>אחר</option>
            </select>

            <button type="button" onclick="saveUser()">
                שמירה
            </button>

        </form>

        <div id="savedMessage" class="success"></div>

    </div>

    <script>

        function saveUser() {

            const fullName =
                document.getElementById("fullName").value;

            const department =
                document.getElementById("department").value;

            if (fullName === "" || department === "") {

                alert("נא למלא שם ומחלקה");

                return;
            }

            localStorage.setItem(
                "fullName",
                fullName
            );

            localStorage.setItem(
                "department",
                department
            );

            document.getElementById(
                "savedMessage"
            ).innerHTML =
                "✅ הנתונים נשמרו בהצלחה";
        }

        window.onload = function () {

            const fullName =
                localStorage.getItem("fullName");

            const department =
                localStorage.getItem("department");

            if (fullName) {
                document.getElementById(
                    "fullName"
                ).value = fullName;
            }

            if (department) {
                document.getElementById(
                    "department"
                ).value = department;
            }
        };

    </script>

</body>

</html>
